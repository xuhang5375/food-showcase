name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets
        run: |
          # js/config.js 已被删除（chore: 移除死代码），仅对存在文件做替换，避免 sed 失败中断部署
          if [ -f js/config.js ]; then
            sed -i "s|\[YOUR_COS_SECRET_ID\]|${{ secrets.COS_SECRET_ID }}|g" js/config.js
            sed -i "s|\[YOUR_COS_SECRET_KEY\]|${{ secrets.COS_SECRET_KEY }}|g" js/config.js
          fi
          if [ -f admin.html ]; then
            sed -i "s|\[YOUR_COS_SECRET_ID\]|${{ secrets.COS_SECRET_ID }}|g" admin.html
            sed -i "s|\[YOUR_COS_SECRET_KEY\]|${{ secrets.COS_SECRET_KEY }}|g" admin.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
