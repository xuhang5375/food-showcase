<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理后台 - 食材采购</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="top-header">
        <span style="color:#fff;font-size:16px;font-weight:600;">管理后台</span>
        <a href="index.html" class="admin-link">返回前台</a>
    </header>

    <div id="loginSection" class="login-page">
        <div class="login-box">
            <h2>管理员登录</h2>
            <input type="password" id="passwordInput" placeholder="请输入管理密码" autocomplete="off">
            <button class="login-btn" onclick="checkPassword()">登 录</button>
        </div>
    </div>

    <div id="adminSection" style="display:none;padding-top:46px;min-height:100vh;">
        <div class="admin-toolbar">
            <button class="btn-add" onclick="showAddForm()">＋ 添加商品</button>
            <button id="videoToggleBtn" onclick="toggleVideo()" style="padding:8px 14px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;margin-left:8px">视频功能: 加载中...</button>
            <button id="visitorBtn" onclick="showVisitorLogs()" style="padding:8px 14px;border:1px solid #2196F3;border-radius:6px;background:#2196F3;color:#fff;cursor:pointer;font-size:13px;margin-left:8px">访客登记</button>
        </div>

        <div id="productForm" class="product-form" style="display:none;">
            <h3 id="formTitle">添加商品</h3>
            <input type="hidden" id="productId">
            <div class="form-group"><label>商品名称 *</label><input type="text" id="productName" placeholder="如：2斤精品水牛切叶" required></div>
            <div class="form-row"><div class="form-group flex1"><label>商品编码</label><input type="text" id="productCode" placeholder="如：2JPSNQYP"></div><div class="form-group flex1"><label>分类</label><select id="productCategory"><option value="黑千层">黑千层</option><option value="白千层">白千层</option><option value="毛肚片">毛肚片</option><option value="整肚">整肚</option><option value="边角料">边角料</option><option value="虾滑">虾滑</option><option value="其他">其他</option></select></div></div>
            <div class="form-row"><div class="form-group flex1"><label>规格</label><input type="text" id="productSpec" placeholder="如：1件*25袋*2斤"></div><div class="form-row-inner"><div class="form-group flex1"><label>价格(元)</label><input type="number" id="productPriceNum" placeholder="数字" min="0" step="0.01"></div><div class="form-group flex1"><label>单位</label><select id="productPriceUnit"><option value="箱">箱</option><option value="斤">斤</option><option value="袋">袋</option><option value="kg">kg</option><option value="包">包</option><option value="件">件</option></select></div></div></div>
            <div class="form-group"><label>商品描述</label><textarea id="productDesc" placeholder="选填，商品详细描述"></textarea></div>
            <div class="form-group"><label>商品图片（可多选）</label><div class="upload-area" onclick="document.getElementById('imageFile').click()"><span id="imageUploadText">点击上传图片</span></div><input type="file" id="imageFile" accept="image/*" multiple style="display:none;"><div id="imagePreview" class="preview-area"></div></div>
            <div class="form-group"><label>商品视频（选填）</label><div class="upload-area" onclick="document.getElementById('videoFile').click()"><span id="videoUploadText">点击上传视频</span></div><input type="file" id="videoFile" accept="video/*" style="display:none;"><div id="videoPreview" class="preview-area"></div></div>
            <div class="form-actions"><button class="btn-save" onclick="saveProduct()">保 存</button><button class="btn-cancel" onclick="hideForm()">取 消</button></div>
        </div>

        <div id="productList" class="admin-list"></div>

        <div id="visitorSection" style="display:none;">
            <div style="padding:12px 16px;display:flex;gap:8px;align-items:center;background:#f9f9f9;border-bottom:1px solid #eee;flex-wrap:wrap">
                <input id="visitorSearch" type="text" placeholder="搜索姓名/手机号..." oninput="filterVisitors()" style="flex:1;min-width:150px;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px">
                <button onclick="loadVisitorLogs()" style="padding:8px 14px;border:none;border-radius:6px;background:#2196F3;color:#fff;cursor:pointer;font-size:13px">刷新</button>
                <button onclick="hideVisitorLogs()" style="padding:8px 14px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:13px">返回商品</button>
            </div>
            <div id="visitorList" class="admin-list"></div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

    <script src="js/admin.js"></script>
</body>
</html>
