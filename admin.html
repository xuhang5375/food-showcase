<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理后台 - 食材采购</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 顶部 -->
    <header class="top-header">
        <span style="color:#fff;font-size:16px;font-weight:600;">管理后台</span>
        <a href="index.html" class="admin-link">返回前台</a>
    </header>

    <!-- 登录页 -->
    <div id="loginSection" class="login-page">
        <div class="login-box">
            <h2>管理员登录</h2>
            <input type="password" id="passwordInput" placeholder="请输入管理密码" autocomplete="off">
            <button class="login-btn" onclick="checkPassword()">登 录</button>
        </div>
    </div>

    <!-- 管理区 -->
    <div id="adminSection" style="display:none;padding-top:46px;min-height:100vh;">
        <div class="admin-toolbar">
            <button class="btn-add" onclick="showAddForm()">＋ 添加商品</button>
        </div>

        <!-- 添加/编辑表单 -->
        <div id="productForm" class="product-form" style="display:none;">
            <h3 id="formTitle">添加商品</h3>
            <input type="hidden" id="productId">

            <div class="form-group">
                <label>商品名称 *</label>
                <input type="text" id="productName" placeholder="如：2斤精品水牛切叶" required>
            </div>

            <div class="form-row">
                <div class="form-group flex1">
                    <label>商品编码</label>
                    <input type="text" id="productCode" placeholder="如：2JPSNQYP">
                </div>
                <div class="form-group flex1">
                    <label>分类</label>
                    <select id="productCategory">
                        <option value="黑千层">黑千层</option>
                        <option value="白千层">白千层</option>
                        <option value="毛肚片">毛肚片</option>
                        <option value="整肚">整肚</option>
                        <option value="边角料">边角料</option>
                        <option value="虾滑">虾滑</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group flex1">
                    <label>规格</label>
                    <input type="text" id="productSpec" placeholder="如：1件*25袋*2斤">
                </div>
                <div class="form-row-inner">
                    <div class="form-group flex1">
                        <label>价格(元)</label>
                        <input type="number" id="productPriceNum" placeholder="数字" min="0" step="0.01">
                    </div>
                    <div class="form-group flex1">
                        <label>单位</label>
                        <select id="productPriceUnit">
                            <option value="箱">箱</option>
                            <option value="斤">斤</option>
                            <option value="袋">袋</option>
                            <option value="kg">kg</option>
                            <option value="包">包</option>
                            <option value="件">件</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>商品描述</label>
                <textarea id="productDesc" placeholder="选填，商品详细描述"></textarea>
            </div>

            <div class="form-group">
                <label>商品图片</label>
                <div class="upload-area" onclick="document.getElementById('imageFile').click()">
                    <span id="imageUploadText">📷 点击上传图片</span>
                </div>
                <input type="file" id="imageFile" accept="image/*" style="display:none;">
                <div id="imagePreview" class="preview-area"></div>
            </div>

            <div class="form-group">
                <label>商品视频（选填）</label>
                <div class="upload-area" onclick="document.getElementById('videoFile').click()">
                    <span id="videoUploadText">🎬 点击上传视频</span>
                </div>
                <input type="file" id="videoFile" accept="video/*" style="display:none;">
                <div id="videoPreview" class="preview-area"></div>
            </div>

            <div class="form-actions">
                <button class="btn-save" onclick="saveProduct()">保 存</button>
                <button class="btn-cancel" onclick="hideForm()">取 消</button>
            </div>
        </div>

        <!-- 商品列表 -->
        <div id="productList" class="admin-list"></div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        const SUPABASE_URL = 'https://infsqrfqksvqzlapvott.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_2z92LEUAiZf6smg9aiufFg_p16OStvD';

        window.supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.ADMIN_PASSWORD = '920615';
        window.TABLE_NAME = 'food_showcase_products';
        window.BUCKET_NAME = 'product-media';
    </script>
    <script src="js/admin.js"></script>
</body>
</html>
