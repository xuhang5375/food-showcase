<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 食材展示</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>管理后台</h1>
        <button onclick="location.href='index.html'">返回首页</button>
    </header>

    <main id="loginSection">
        <div class="login-box">
            <h2>管理员登录</h2>
            <input type="password" id="passwordInput" placeholder="请输入管理密码">
            <button onclick="checkPassword()">登录</button>
        </div>
    </main>

    <main id="adminSection" style="display:none;">
        <div class="admin-toolbar">
            <button class="btn-primary" onclick="showAddForm()">添加商品</button>
        </div>

        <div id="productForm" class="product-form" style="display:none;">
            <h3 id="formTitle">添加商品</h3>
            <input type="hidden" id="productId">
            <input type="text" id="productName" placeholder="商品名称 *" required>
            <textarea id="productDesc" placeholder="商品描述"></textarea>
            <select id="productCategory">
                <option value="黑千层">黑千层</option>
                <option value="白千层">白千层</option>
                <option value="叶片">叶片</option>
                <option value="整肚">整肚</option>
                <option value="边角料">边角料</option>
                <option value="虾滑">虾滑</option>
                <option value="冻品">冻品</option>
            </select>
            <input type="text" id="productSpec" placeholder="规格（如：500g/盒）">
            <input type="text" id="productPrice" placeholder="价格（如：35.00元/盒）">
            <div class="upload-section">
                <label>图片上传：</label>
                <input type="file" id="imageFile" accept="image/*">
                <div id="imagePreview"></div>
            </div>
            <div class="upload-section">
                <label>视频上传：</label>
                <input type="file" id="videoFile" accept="video/*">
                <div id="videoPreview"></div>
            </div>
            <div class="form-actions">
                <button class="btn-primary" onclick="saveProduct()">保存</button>
                <button onclick="hideForm()">取消</button>
            </div>
        </div>

        <div id="productList"></div>
    </main>

        const SUPABASE_URL = 'https://infsqrfqksvqzlapvott.supabase.co';

        const script = document.createElement('script');
        script.src = 'js/admin.js';
        document.body.appendChild(script);
    </script>
</body>
</html>
